server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ocean-duty-server
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${SQLITE_PATH:./data/ocean-duty.db}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  quartz:
    job-store-type: memory
    auto-startup: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ocean-duty:
  monitor:
    site-timeout-ms: 10000
    module-timeout-ms: 15000
    module-check-enabled: false
    nmefc-api-base: https://www.nmefc.cn/api
  jwt:
    secret: ${JWT_SECRET:ocean-duty-default-secret-change-in-production}
    expire-hours: 24
  security:
    encrypt-secret: ${ENCRYPT_SECRET:${JWT_SECRET:ocean-duty-default-secret-change-in-production}}
  datasource:
    cms:
      # 仅首次初始化默认 CMS 数据源时使用，不落库明文；生产请用环境变量注入
      initial-password: ${CMS_DATASOURCE_PASSWORD:}

logging:
  level:
    com.oceanduty: info
    org.springframework: warn
