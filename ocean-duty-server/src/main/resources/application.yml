server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: ocean-duty-server
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${SQLITE_PATH:./data/ocean-duty.db}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  quartz:
    job-store-type: memory
    auto-startup: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

ocean-duty:
  cache:
    enabled: ${CACHE_ENABLED:true}
    dashboard-ttl-seconds: ${CACHE_DASHBOARD_TTL:60}
  monitor:
    site-timeout-ms: 10000
    module-timeout-ms: 15000
    module-check-enabled: false
    nmefc-api-base: https://www.nmefc.cn/api
    grid-ftp:
      enabled: ${GRID_FTP_ENABLED:true}
      host: ${GRID_FTP_HOST:128.5.10.65}
      port: ${GRID_FTP_PORT:21}
      username: ${GRID_FTP_USERNAME:ag_duty_watcher}
      password: ${GRID_FTP_PASSWORD:duty_nmefc}
      mount-base: ${GRID_FTP_MOUNT_BASE:/Volumes/128.5.10.65}
      connect-timeout-ms: ${GRID_FTP_CONNECT_TIMEOUT_MS:10000}
      data-timeout-ms: ${GRID_FTP_DATA_TIMEOUT_MS:30000}
    grid-version:
      mysql-datasource-id: ${GRID_VERSION_MYSQL_DS_ID:1}
      controller-table: pro_version_controller
    typhoon-surge:
      ftp:
        enabled: ${TYPHOON_SURGE_FTP_ENABLED:true}
        host: ${TYPHOON_SURGE_FTP_HOST:128.5.2.164}
        port: ${TYPHOON_SURGE_FTP_PORT:21}
        username: ${TYPHOON_SURGE_FTP_USERNAME:surge_duty_watcher}
        password: ${TYPHOON_SURGE_FTP_PASSWORD:}
        base-dir: /ty_surge/nc_maxsurge
        mount-base: ${TYPHOON_SURGE_FTP_MOUNT_BASE:}
        connect-timeout-ms: ${TYPHOON_SURGE_FTP_CONNECT_TIMEOUT_MS:10000}
        data-timeout-ms: ${TYPHOON_SURGE_FTP_DATA_TIMEOUT_MS:30000}
      share:
        enabled: ${TYPHOON_SURGE_SHARE_ENABLED:true}
        mount-base: ${TYPHOON_SURGE_SHARE_MOUNT_BASE:}
        sub-dir: ty_surge/result
  jwt:
    secret: ${JWT_SECRET:ocean-duty-default-secret-change-in-production}
    expire-hours: 24
  security:
    encrypt-secret: ${ENCRYPT_SECRET:${JWT_SECRET:ocean-duty-default-secret-change-in-production}}
  datasource:
    cms:
      # 仅首次初始化默认 CMS 数据源时使用，不落库明文；生产请用环境变量注入
      initial-password: ${CMS_DATASOURCE_PASSWORD:}
    grid:
      initial-password: ${GRID_DATASOURCE_PASSWORD:}
    typhoon-surge:
      initial-password: ${TYPHOON_SURGE_DATASOURCE_PASSWORD:}
      ftp-password: ${TYPHOON_SURGE_FTP_PASSWORD:}
      share-password: ${TYPHOON_SURGE_SHARE_PASSWORD:}

logging:
  level:
    com.oceanduty: info
    org.springframework: warn
