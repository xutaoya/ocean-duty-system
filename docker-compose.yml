version: '3.8'

services:
  server:
    build: ./ocean-duty-server
    container_name: ocean-duty-server
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/app/data
    environment:
      - SQLITE_PATH=/app/data/ocean-duty.db
      - REDIS_HOST=redis
      - CACHE_ENABLED=true
    depends_on:
      - redis
    restart: unless-stopped

  web:
    build: ./ocean-duty-web
    container_name: ocean-duty-web
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ocean-duty-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  sqlite-data:
